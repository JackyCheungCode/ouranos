<header class="ouranos-header" data-header-variant="auto" aria-label="OURANOS site header">
  <div class="ouranos-header__utility">
    <div class="ouranos-header__utility-inner">
      <span class="ouranos-header__eyebrow">OURANOS / PRECISION IN EVERY FORM</span>
      <div class="ouranos-header__actions">
        <p-button-pure
          id="ouranos-ai-open"
          class="ouranos-header__ai"
          type="button"
          icon="ai-chat"
          hide-label="true"
          title="OURANOS AI Assistant"
          aria-label="OURANOS AI Assistant"
          color="inherit"
        >
          AI Assistant
        </p-button-pure>
        <p-button-pure
          class="ouranos-header__search"
          type="button"
          icon="search"
          hide-label="true"
          title="Search"
          aria-label="Search"
          color="inherit"
        >
          Search
        </p-button-pure>
        <p-button-pure
          id="ouranos-account"
          class="ouranos-header__account"
          type="button"
          icon="user"
          hide-label="true"
          title="Account"
          aria-label="Account"
          color="inherit"
        >
          Account
        </p-button-pure>
        <nav class="ouranos-header__menu" aria-label="Site menu">
          <p-button-pure
            id="nav-button"
            type="button"
            icon="menu-lines"
            hide-label="true"
            aria="{'aria-haspopup': 'dialog'}"
            color="inherit"
          >
            Menu
          </p-button-pure>
          <!-- OURANOS:SIDEBAR -->
        </nav>
      </div>
    </div>
  </div>
  <div class="ouranos-header__main">
    <div class="ouranos-header__main-inner">
      <a class="ouranos-wordmark" href="/" aria-label="Ouranos Home">OURANOS</a>
      <nav class="ouranos-header__primary-nav" aria-label="Primary navigation">
        <a href="/cast-wheel-collection/" data-i18n="wheels">Wheels</a>
        <a href="/cast-wheel-collection/#catalogue" data-i18n="fitment">Find your fit</a>
        <a href="/discover/" data-i18n="discover">Discover</a>
        <a href="/contact/" data-i18n="contact">Contact</a>
      </nav>
    </div>
  </div>
</header>
