<header
      class="z-1 grid-template absolute inset-x-0 before:absolute before:inset-[0_0_-60px_0] before:-z-1 before:pointer-events-none before:bg-fade-to-b"
    >
      <div class="col-wide grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] gap-fluid-md items-center min-h-[80px]">
        <div class="flex flex-wrap gap-static-md items-center justify-start">
          <nav aria-label="Main">
            <p-button-pure
              id="nav-button"
              class="scheme-dark p-static-xs -m-static-xs"
              type="button"
              icon="menu-lines"
              hide-label="{base: true, s: false}"
              aria="{'aria-haspopup': 'dialog'}"
            >
              Menu
            </p-button-pure>
            <!-- OURANOS:SIDEBAR -->
          </nav>
        </div>
        <a class="scheme-dark sm:hidden font-semibold tracking-[0.18em]" href="/" aria-label="Ouranos Home">OURANOS</a>
        <a class="scheme-dark max-sm:hidden font-semibold tracking-[0.18em]" href="/" aria-label="Ouranos Home">OURANOS</a>
        <div class="scheme-dark flex flex-wrap gap-static-md items-center justify-end">
          <p-button-pure class="p-static-xs -m-static-xs" title="Search" type="button" icon="search" hide-label="true">
            Search
          </p-button-pure>
          <p-button-pure class="p-static-xs -m-static-xs" title="User" type="button" icon="user" hide-label="true">
            User
          </p-button-pure>
        </div>
      </div>
    </header>
