<header
  class="ouranos-header z-1 grid-template absolute inset-x-0 top-0 before:absolute before:inset-[0_0_-60px_0] before:-z-1 before:pointer-events-none before:bg-fade-to-b"
  data-header-variant="overlay"
  aria-label="OURANOS site header"
>
  <video class="ouranos-header__video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
    <source src="/videos/mood-porsche-gts.mp4" type="video/mp4">
  </video>
  <div class="col-wide grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] gap-fluid-md items-center min-h-[80px]">
    <div class="flex flex-wrap gap-static-md items-center justify-start" style="color: #fff">
      <nav aria-label="Main">
        <p-button-pure color="inherit" id="nav-button" class="p-static-xs -m-static-xs" style="color: #fff" type="button" icon="menu-lines" hide-label="{base: true, s: false}" aria="{'aria-haspopup': 'dialog'}">
          Menu
        </p-button-pure>
        <!-- OURANOS:SIDEBAR -->
      </nav>
    </div>
    <a class="ouranos-header__brand" href="/" aria-label="Ouranos Home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" overflow="visible" role="img" aria-labelledby="ouranos-brand-title">
        <title id="ouranos-brand-title">Ouranos</title>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap');
          text { font-family: 'Mrs Saint Delafield', 'Brush Script MT', cursive; font-size: 150px; fill: #ffffff; }
        </style>
        <text x="280" y="140" text-anchor="middle">Ouranos</text>
      </svg>
    </a>
    <div class="flex flex-wrap gap-static-md items-center justify-end" style="color: #fff">
      <p-popover id="ouranos-language-popover" direction="bottom" compact="true">
        <p-button-pure color="inherit" slot="button" id="ouranos-language-trigger" class="p-static-xs -m-static-xs" style="color: #fff" type="button" icon="globe" hide-label="true" title="Language: English" aria-label="Language: English">Language: English</p-button-pure>
        <div class="ouranos-language-menu" role="group" aria-label="Select language">
          <button class="ouranos-language-option" type="button" data-locale="en" aria-pressed="true">English</button>
          <button class="ouranos-language-option" type="button" data-locale="zh-CN" aria-pressed="false">简体中文</button>
          <button class="ouranos-language-option" type="button" data-locale="de" aria-pressed="false">Deutsch</button>
          <button class="ouranos-language-option" type="button" data-locale="fr" aria-pressed="false">Français</button>
          <button class="ouranos-language-option" type="button" data-locale="ja" aria-pressed="false">日本語</button>
        </div>
      </p-popover>
      <p-button-pure color="inherit" id="ouranos-ai-open" class="p-static-xs -m-static-xs" style="color: #fff" type="button" icon="ai-chat" hide-label="true" title="OURANOS AI Assistant" aria-label="OURANOS AI Assistant">AI Assistant</p-button-pure>
      <p-button-pure color="inherit" id="ouranos-account" class="p-static-xs -m-static-xs" style="color: #fff" title="Account" type="button" icon="user" hide-label="true">Account</p-button-pure>
    </div>
  </div>
</header>
