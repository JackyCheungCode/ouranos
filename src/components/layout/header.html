<!-- OURANOS:TOPBAR -->

<aside id="ouranos-ai-panel" class="ouranos-ai-panel" role="dialog" aria-modal="true" aria-labelledby="ouranos-ai-title" aria-label="OURANOS AI Assistant" aria-hidden="true" inert>
  <div class="ouranos-ai-panel__header">
    <div><p-heading id="ouranos-ai-title" tag="h2" size="sm">OURANOS AI</p-heading><p-text size="xs" color="contrast-medium">Your wheel fitment specialist</p-text></div>
    <p-button-pure id="ouranos-ai-close" type="button" icon="close" hide-label="true">Close assistant</p-button-pure>
  </div>
  <div id="ouranos-ai-messages" class="ouranos-ai-panel__messages" aria-live="polite">
    <div class="ouranos-ai-message ouranos-ai-message--assistant">I can help identify your vehicle, verify wheel fitment, compare specifications and explore OURANOS designs. What would you like to know?</div>
  </div>
  <form id="ouranos-ai-form" class="ouranos-ai-panel__form">
    <label class="sr-only" for="ouranos-ai-input">Ask OURANOS AI</label>
    <textarea id="ouranos-ai-input" rows="2" maxlength="4000" placeholder="Ask about your vehicle or wheel fitment..." required></textarea>
    <button type="submit" aria-label="Send message"><span>Send</span><span aria-hidden="true">↗</span></button>
  </form>
  <p class="ouranos-ai-panel__disclaimer">Fitment guidance must be verified against your exact vehicle configuration.</p>
</aside>
