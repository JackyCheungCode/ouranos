name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync and commit npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync npm dependency lockfile"
            git push
          fi

      - name: Generate lockfile for pull request validation
        if: github.event_name == 'pull_request'
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply and commit formatting
        run: |
          npm run format
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests '*.config.ts' eslint.config.js
            if ! git diff --cached --quiet; then
              git commit -m "style: apply project formatting"
              git push
            fi
          fi

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests against local Worker
        run: npm run test:e2e

      - name: Cloudflare Worker dry run
        run: npm run deploy:dry-run

      - name: Deploy Cloudflare Worker to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
